<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบประเมิน 9Q และ 8Q - MindCare SDPY</title>
  <!-- โหลด LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 15px; background-color: #f7f9fa; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto; }
    h2 { color: #1DB446; text-align: center; margin-bottom: 5px; }
    h3 { color: #555; border-bottom: 2px solid #1DB446; padding-bottom: 5px; margin-top: 25px; }
    p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
    .question-box { margin-bottom: 15px; background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
    .options { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    button { width: 100%; background: #1DB446; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    button:disabled { background: #ccc; }

    /* ดีไซน์ Pop-up Modal */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .modal-content h3 { color: #1DB446; margin-top: 0; border: none; }
    .score-badge { font-size: 20px; font-weight: bold; color: #333; background: #e8f5e9; padding: 10px; border-radius: 8px; margin: 15px 0; }
    .feedback-box { text-align: left; background: #f9f9f9; padding: 12px; border-radius: 6px; font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.5; }
    .close-btn { background: #1DB446; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

<div class="card">
  <h2>MindCare SDPY</h2>
  <p class="subtitle">แบบประเมินสุขภาพจิต (9Q และ 8Q)</p>
  
  <form id="evalForm">
    <!-- ส่วนที่ 1: แบบประเมิน 9Q -->
    <h3>ส่วนที่ 1: แบบประเมินอาการซึมเศร้า (9Q)</h3>
    <p style="font-size: 13px; color: #666;">ในช่วง 2 สัปดาห์ที่ผ่านมา รวมวันนี้ ท่านมีอาการเหล่านี้บ่อยแค่ไหน?</p>
    
    <div id="q9-container"></div>

    <!-- ส่วนที่ 2: แบบประเมิน 8Q -->
    <h3>ส่วนที่ 2: แบบประเมินความเสี่ยงต่อการฆ่าตัวตาย (8Q)</h3>
    
    <div id="q8-container"></div>

    <button type="submit" id="submitBtn">ประเมินผลและส่งข้อมูล</button>
  </form>
</div>

<!-- Modal Pop-up แสดงผลลัพธ์ -->
<div id="resultModal" class="modal">
  <div class="modal-content">
    <h3>📋 สรุปผลการประเมินของคุณ</h3>
    <div class="score-badge" id="modalScoreText">คะแนนรวม: 0 คะแนน</div>
    <div class="feedback-box" id="modalFeedbackText">-</div>
    <button class="close-btn" onclick="closeModalAndFinish()">รับทราบและปิดหน้าต่าง</button>
  </div>
</div>

<script>
  // 🔴 1. ตั้งค่า LIFF ID และ Web App URL ของคุณที่นี่
  const LIFF_ID = "YOUR_LIFF_ID"; 
  const GAS_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 

  let userId = "";
  let finalDataPayload = null;

  // รายการคำถาม 9Q
  const questions9Q = [
    "1. เบื่อ ไม่ค่อยสนใจหรือเพลิดเพลินในการทำอะไร",
    "2. ไม่สบายใจ ซึมเศร้า หรือท้อแท้",
    "3. หลับยาก หรือหลับๆ ตื่นๆ หรือหลับมากไป",
    "4. เหนื่อยง่าย หรือไม่ค่อยมีแรง",
    "5. เบื่ออาหาร หรือกินมากเกินไป",
    "6. รู้สึกไม่ดีกับตัวเอง คิดว่าตัวเองล้มเหลว หรือทำให้ตนเองและครอบครัวผิดหวัง",
    "7. สมาธิไม่ดีเวลาทำอะไร เช่น ดูโทรทัศน์ ฟังวิทยุ หรือทำงานที่ต้องใช้ความจำ",
    "8. พูดหรือทำอะไรช้ากว่าปกติจนคนอื่นสังเกตเห็นได้ หรือกระสับกระส่ายไม่สามารถอยู่นิ่งได้",
    "9. คิดทำร้ายตนเอง หรือคิดว่าถ้าตาย  ๆ ไปเสียคงจะดี"
  ];

  // รายการคำถาม 8Q (ตัวอย่างข้อสำคัญ)
  const questions8Q = [
    "10. ท่านเคยคิดอยากตาย หรือคิดว่าอยากตายไปเสียให้รู้แล้วรู้รอด ในช่วง 1 เดือนที่ผ่านมา",
    "11. ท่านเคยคิดอยากจะทำร้ายตัวเอง หรือพยายามฆ่าตัวตาย ในช่วง 1 เดือนที่ผ่านมา"
  ];

  const choices = [
    { label: "ไม่มีเลย (0 คะแนน)", val: 0 },
    { label: "เป็นบางวัน 1-7 วัน (1 คะแนน)", val: 1 },
    { label: "เป็นบ่อย 8-13 วัน (2 คะแนน)", val: 2 },
    { label: "เป็นทุกวัน เกือบทุกวัน (3 คะแนน)", val: 3 }
  ];

  window.onload = function() {
    renderQuestions();
    initializeLiff();
  };

  // สร้างฟอร์มคำถามอัตโนมัติ
  function renderQuestions() {
    const q9Div = document.getElementById("q9-container");
    questions9Q.forEach((q, index) => {
      let html = `<div class="question-box"><p><b>${q}</b></p><div class="options">`;
      choices.forEach(c => {
        html += `<label><input type="radio" name="q${index+1}" value="${c.val}" required> ${c.label}</label>`;
      });
      html += `</div></div>`;
      q9Div.innerHTML += html;
    });

    const q8Div = document.getElementById("q8-container");
    questions8Q.forEach((q, index) => {
      let html = `<div class="question-box"><p><b>${q}</b></p><div class="options">`;
      html += `<label><input type="radio" name="q8_${index+1}" value="0" required> ไม่เคย</label>`;
      html += `<label><input type="radio" name="q8_${index+1}" value="1"> เคย</label>`;
      html += `</div></div>`;
      q8Div.innerHTML += html;
    });
  }

  function initializeLiff() {
    liff.init({ liffId: LIFF_ID }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        liff.getProfile().then(profile => {
          userId = profile.userId;
        });
      }
    }).catch(err => console.error("LIFF Init Error:", err));
  }

  // กดส่งแบบประเมิน
  document.getElementById("evalForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "กำลังประมวลผล...";

    // คำนวณคะแนน 9Q
    let score9Q = 0;
    for (let i = 1; i <= 9; i++) {
      const val = document.querySelector(`input[name="q${i}"]:checked`).value;
      score9Q += parseInt(val);
    }

    // คำนวณคะแนน 8Q
    let score8Q = 0;
    for (let i = 1; i <= 2; i++) {
      const val = document.querySelector(`input[name="q8_${i}"]:checked`).value;
      score8Q += parseInt(val);
    }

    // สรุปผลและคำแนะนำตามเกณฑ์
    let feedback = "";
    if (score9Q <= 7) {
      feedback = "<b>เกณฑ์ปกติ:</b> ไม่มีอาการของโรคซึมเศร้า หรือมีอาการซึมเศร้ามนระดับน้อยมาก แนะนำให้ดูแลสุขภาพใจและพักผ่อนอย่างเพียงพอ";
    } else if (score9Q <= 12) {
      feedback = "<b>ซึมเศร้าระดับน้อย:</b> มีอาการซึมเศร้าระดับน้อย ควรหากิจกรรมผ่อนคลายทำ พูดคุยกับคนใกล้ชิด";
    } else if (score9Q <= 18) {
      feedback = "<b>ซึมเศร้าระดับปานกลาง:</b> มีอาการซึมเศร้าระดับปานกลาง แนะนำให้ปรึกษาบุคลากรทางแพทย์หรือผู้เชี่ยวชาญเพื่อรับคำแนะนำเพิ่มเติม";
    } else {
      feedback = "<b>ซึมเศร้าระดับรุนแรง:</b> มีอาการซึมเศร้าระดับรุนแรง ควรพบแพทย์หรือผู้เชี่ยวชาญด้านสุขภาพจิตโดยเร็วที่สุด";
    }

    if (score8Q > 0) {
      feedback += "<br><br><span style='color: #d9534f; font-weight: bold;'>⚠️ ข้อสังเกต 8Q: พบความเสี่ยงต่อการทำร้ายตนเอง แนะนำให้ติดต่อสายด่วนสุขภาพจิต 1323 หรือปรึกษาเจ้าหน้าที่สาธารณสุขใกล้บ้านทันที</span>";
    }

    const summaryText = `9Q คะแนนรวม: ${score9Q} คะแนน<br>8Q คะแนนความเสี่ยง: ${score8Q} คะแนน`;

    // แสดง Pop-up Modal พร้อมผลคะแนนและคำแนะนำ
    document.getElementById("modalScoreText").innerHTML = summaryText;
    document.getElementById("modalFeedbackText").innerHTML = feedback;
    document.getElementById("resultModal").style.display = "flex";

    // เตรียมแพย์โหลดส่งหลังบ้าน
    finalDataPayload = {
      userId: userId,
      score: `9Q: ${score9Q}, 8Q: ${score8Q}`,
      feedback: feedback.replace(/<[^>]*>?/gm, '') // ล้างแท็ก HTML ออกสำหรับบันทึกข้อความ
    };

    // ส่งข้อมูลไป Google Sheets
    try {
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(finalDataPayload)
      });
    } catch (err) {
      console.error("Sheet saving error:", err);
    }
  });

  // ปิด Pop-up และส่งข้อความเข้าแชท LINE
  async function closeModalAndFinish() {
    document.getElementById("resultModal").style.display = "none";

    if (liff.isInClient() && finalDataPayload) {
      try {
        await liff.sendMessages([
          {
            type: "flex",
            altText: "ผลการประเมิน 9Q และ 8Q ของคุณ",
            contents: {
              type: "bubble",
              body: {
                type: "box",
                layout: "vertical",
                contents: [
                  { type: "text", text: "📋 สรุปผลประเมิน 9Q / 8Q", weight: "bold", size: "md", color: "#1DB446" },
                  { type: "text", text: "คะแนน: " + finalDataPayload.score, size: "sm", margin: "md", weight: "bold" },
                  { type: "separator", margin: "md" },
                  { type: "text", text: "คำแนะนำ:", weight: "bold", size: "sm", margin: "md", color: "#555555" },
                  { type: "text", text: finalDataPayload.feedback, size: "xs", wrap: true, color: "#666666", margin: "sm" }
                ]
              }
            }
          }
        ]);
        liff.closeWindow();
      } catch (err) {
        alert("ส่งข้อความเข้าแชทไม่สำเร็จ: " + err.message);
      }
    } else {
      liff.closeWindow();
    }
  }
</script>

</body>
</html>
