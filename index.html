<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบประเมินสุขภาพใจ - MindCare SDPY</title>
  <!-- โหลด LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; word-wrap: break-word; overflow-wrap: break-word; }
    body { background-color: #f0f4f8; margin: 0; padding: 12px; color: #333; }
    .container { width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
    
    .header { background: linear-gradient(135deg, #1DB446 0%, #108a33 100%); padding: 22px 16px; text-align: center; color: white; }
    .header h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; font-weight: 300; }

    .content { padding: 16px; }
    .section-title { font-size: 15px; font-weight: 600; color: #1DB446; margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #e8f5e9; display: flex; align-items: center; gap: 8px; }
    .section-desc { font-size: 12px; color: #666; margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 8px; border-left: 3px solid #1DB446; line-height: 1.4; }

    .question-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .question-title { font-size: 13px; font-weight: 500; color: #2d3748; margin-bottom: 10px; line-height: 1.4; }
    
    .options { display: flex; flex-direction: column; gap: 6px; }
    .option-label { display: flex; align-items: center; padding: 10px 12px; background: #f8fafc; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid #e2e8f0; transition: all 0.2s; }
    .option-label:hover { background: #f1f5f9; }
    .option-label input[type="radio"] { margin-right: 10px; accent-color: #1DB446; width: 18px; height: 18px; flex-shrink: 0; }

    .btn-submit { width: 100%; background: #1DB446; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 12px rgba(29, 180, 70, 0.25); }
    .btn-submit:hover { background: #159b3a; }
    .btn-submit:disabled { background: #cbd5e1; box-shadow: none; }

    /* Modal Pop-up UI */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 450px; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
    
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
    .feedback-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; font-size: 13px; color: #334155; margin-bottom: 12px; line-height: 1.5; }
    .contact-box { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 12px; border-radius: 10px; font-size: 12px; color: #475569; margin-bottom: 16px; line-height: 1.5; }
    .close-btn { background: #1DB446; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>MindCare SDPY</h2>
    <p>แบบประเมินคัดกรองสุขภาพใจ (9Q & 8Q)</p>
  </div>

  <div class="content">
    <form id="evalForm">
      <!-- ส่วนที่ 1: 9Q -->
      <div class="section-title">🌱 ส่วนที่ 1: แบบประเมินโรคซึมเศร้า (9Q)</div>
      <div class="section-desc">ในช่วง 2 สัปดาห์ที่ผ่านมา รวมวันนี้ ท่านมีอาการเหล่านี้บ่อยแค่ไหน?</div>
      <div id="q9-container"></div>

      <!-- ส่วนที่ 2: 8Q -->
      <div class="section-title">🛡️ ส่วนที่ 2: แบบประเมินความเสี่ยงต่อการฆ่าตัวตาย (8Q)</div>
      <div class="section-desc">ในช่วงที่ผ่านมา ท่านมีอาการหรือความคิดเหล่านี้หรือไม่?</div>
      <div id="q8-container"></div>

      <button type="submit" id="submitBtn" class="btn-submit">ส่งแบบประเมิน</button>
    </form>
  </div>
</div>

<!-- Modal Pop-up สรุปผล -->
<div id="resultModal" class="modal">
  <div class="modal-content">
    <div class="modal-title" id="modalTitleText">🌿 สรุปผลประเมิน MindCare</div>
    <div class="feedback-box" id="modalFeedbackText">-</div>
    <div class="contact-box" id="modalContactText">-</div>
    <button class="close-btn" onclick="closeModalAndFinish()">รับทราบและปิดหน้าต่าง</button>
  </div>
</div>

<script>
  const LIFF_ID = "2012444081-koBK4ZLP"; 
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzXfCcEkCdXBI2fYwhp5uJEnFVZJSFfzL2C2OHcDF1FUf2Qx3rIOlU0TeaoQa4lZmUo/exec"; 

  let finalDataPayload = null;

  const questions9Q = [
    "1. เบื่อไม่สนใจอยากทำอะไร",
    "2. ไม่สนใจ ซึมเศร้า ท้อแท้",
    "3. หลับยาก หรือหลับๆ ตื่นๆ หรือหลับมากไป",
    "4. เหนื่อยง่าย หรือ ไม่ค่อยมีแรง",
    "5. เบื่ออาหาร หรือกินมากเกินไป",
    "6. รู้สึกไม่ดีกับตนเอง คิดว่าตนเองล้มเหลว หรือ ทำให้ตนเองหรือครอบครัวผิดหวัง",
    "7. สมาธิไม่ดีเวลาทำอะไร เช่น ดูโทรทัศน์ ฟังวิทยุ หรือทำงานที่ต้องใช้ความตั้งใจ",
    "8. พูดช้า ทำอะไรช้าจนคนอื่นสังเกตเห็นได้ หรือกระสับกระส่ายไม่สามารถอยู่นิ่งได้เหมือนที่เคยเป็น",
    "9. คิดทำร้ายตนเอง หรือคิดว่าถ้าตายไปคงจะดี"
  ];

  const questions8Q = [
    { q: "1. คิดอยากตายหรือคิดว่าตายไปจะดีกว่า", w: 1 },
    { q: "2. อยากทำร้ายตนเอง หรือทำให้ตนเองบาดเจ็บ", w: 2 },
    { q: "3. คิดเกี่ยวกับการฆ่าตัวตาย", w: 3 },
    { q: "4. คิดเกี่ยวกับการฆ่าตัวตาย และไม่สามารถควบคุมความอยากฆ่าตัวตายได้", w: 4 },
    { q: "5. มีแผนการที่จะฆ่าตัวตาย", w: 5 },
    { q: "6. ได้เตรียมการที่จะทำร้ายตนเองหรือเตรียมการจะฆ่าตัวตายโดยตั้งใจจะให้ตายจริงๆ", w: 6 },
    { q: "7. ได้ทำให้ตนเองบาดเจ็บแต่ไม่ตั้งใจที่จะทำให้เสียชีวิต", w: 7 },
    { q: "8. ได้พยายามฆ่าตัวตาย โดยคาดหวัง/ตั้งใจที่จะตาย", w: 8 },
    { q: "9. ท่านเคยพยายามฆ่าตัวตาย", w: 9 }
  ];

  const choices9Q = [
    { label: "ไม่มีเลย", val: 0 },
    { label: "เป็นบางวัน (1-7 วัน)", val: 1 },
    { label: "เป็นบ่อย (8-13 วัน)", val: 2 },
    { label: "เป็นทุกวัน (เกือบทุกวัน)", val: 3 }
  ];

  window.onload = function() {
    renderQuestions();
    initializeLiff();
  };

  function renderQuestions() {
    const q9Div = document.getElementById("q9-container");
    questions9Q.forEach((qText, index) => {
      let html = `<div class="question-card"><div class="question-title">${qText}</div><div class="options">`;
      choices9Q.forEach(c => {
        html += `<label class="option-label"><input type="radio" name="q9_${index+1}" value="${c.val}" required> ${c.label}</label>`;
      });
      html += `</div></div>`;
      q9Div.innerHTML += html;
    });

    const q8Div = document.getElementById("q8-container");
    questions8Q.forEach((item, index) => {
      let html = `<div class="question-card"><div class="question-title">${item.q}</div><div class="options">`;
      html += `<label class="option-label"><input type="radio" name="q8_${index+1}" value="0" required> ไม่มี</label>`;
      html += `<label class="option-label"><input type="radio" name="q8_${index+1}" value="${item.w}"> มี</label>`;
      html += `</div></div>`;
      q8Div.innerHTML += html;
    });
  }

  async function initializeLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF Init Error:", err);
    }
  }

  document.getElementById("evalForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    if (!liff.isLoggedIn()) {
      alert("กรุณาเข้าสู่ระบบ LINE ก่อนทำแบบประเมิน");
      liff.login();
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "กำลังประมวลผล...";

    let userName = "ไม่ระบุชื่อ";
    let userId = "ไม่ระบุ ID";

    try {
      const idToken = liff.getDecodedIDToken();
      if (idToken) {
        userName = idToken.name || "ไม่ระบุชื่อ";
        userId = idToken.sub || "ไม่ระบุ ID";
      } else {
        const profile = await liff.getProfile();
        userName = profile.displayName || "ไม่ระบุชื่อ";
        userId = profile.userId || "ไม่ระบุ ID";
      }
    } catch (err) {
      console.error("Get User Info Error:", err);
    }

    let score9Q = 0;
    for (let i = 1; i <= 9; i++) {
      score9Q += parseInt(document.querySelector(`input[name="q9_${i}"]:checked`).value);
    }

    let score8Q = 0;
    for (let i = 1; i <= questions8Q.length; i++) {
      score8Q += parseInt(document.querySelector(`input[name="q8_${i}"]:checked`).value);
    }

    let realColorLevel = "เขียว";
    if (score8Q > 0 || score9Q >= 13) {
      realColorLevel = (score8Q >= 9 || score9Q >= 19) ? "แดง" : "เหลือง";
    }

    let modalTitle = "";
    let adviceText = "";
    let contactText = "";

    if (realColorLevel === "เขียว") {
      modalTitle = "🟢 คุณมีสภาพจิตใจอยู่ในเกณฑ์ที่ดี";
      adviceText = "มีการจัดการอารมณ์ที่ดีและมีความเข้มแข็งทางจิตใจ สามารถดูแลสุขภาพใจของตนเองได้อย่างสม่ำเสมอ";
      contactText = "📌 ช่องทางขอคำปรึกษาเพิ่มเติม:\n• รับการปรึกษาได้ที่โรงพยาบาลใกล้บ้าน\n• สายด่วนสุขภาพจิต 1323 (ฟรี 24 ชม.)";
    } else if (realColorLevel === "เหลือง") {
      modalTitle = "🟡 คุณมีภาวะเครียดหรืออารมณ์เหนื่อยล้าสะสม";
      adviceText = "ควรเพิ่มเวลาพักผ่อน ผ่อนคลายความเครียด และทำกิจกรรมที่ช่วยฟื้นฟูสภาพจิตใจ หากต้องการคนรับฟัง สามารถขอรับคำปรึกษาผ่านช่องทางแชทนี้ได้ตลอดเวลา";
      contactText = "🤝 ช่องทางขอคำปรึกษาเพิ่มเติม:\n• รับการปรึกษาได้ที่โรงพยาบาลใกล้บ้าน\n• สายด่วนสุขภาพจิต 1323 (ฟรี 24 ชม.)\n• เจ็บป่วยฉุกเฉิน 1669 (ฟรี 24 ชม.)";
    } else {
      modalTitle = "🔴 คุณกำลังเผชิญความทุกข์ใจหรือมีความเครียดระดับสูง";
      adviceText = "ทางทีมสุขภาพจิตได้รับข้อมูลแล้ว และกำลังเร่งประสานงานเพื่อดูแลอย่างใกล้ชิด";
      contactText = "🚑 ช่องทางขอความช่วยเหลือทันที:\n• เข้ารับการปรึกษา/รักษาได้ที่โรงพยาบาลใกล้บ้าน\n• สายด่วนสุขภาพจิต 1323 (ฟรี 24 ชม.)\n• เจ็บป่วยฉุกเฉิน 1669 (ฟรี 24 ชม.)";
    }

    document.getElementById("modalTitleText").innerText = modalTitle;
    document.getElementById("modalFeedbackText").innerHTML = `<b>คะแนนประเมิน:</b> 9Q = ${score9Q}, 8Q = ${score8Q}<br><br><b>คำแนะนำ:</b> ${adviceText}`;
    document.getElementById("modalContactText").innerHTML = contactText.replace(/\n/g, "<br>");
    document.getElementById("resultModal").style.display = "flex";

    const formattedUser = `${userName} (${userId})`;

    finalDataPayload = {
      userId: formattedUser, 
      score: `9Q: ${score9Q}, 8Q: ${score8Q}`,
      feedback: adviceText,
      contact: contactText,
      colorLevel: realColorLevel,
      modalTitle: modalTitle
    };

    try {
      await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(finalDataPayload)
      });
    } catch (err) { 
      console.error("Sheets Error:", err); 
    }
  });

  async function closeModalAndFinish() {
    document.getElementById("resultModal").style.display = "none";
    if (liff.isInClient() && finalDataPayload) {
      try {
        await liff.sendMessages([{
          type: "flex",
          altText: "สรุปผลการประเมินสุขภาพใจ MindCare SDPY",
          contents: {
            type: "bubble",
            body: {
              type: "box",
              layout: "vertical",
              contents: [
                { type: "text", text: finalDataPayload.modalTitle, weight: "bold", size: "md", wrap: true, color: finalDataPayload.colorLevel === 'แดง' ? '#EF4444' : (finalDataPayload.colorLevel === 'เหลือง' ? '#EAB308' : '#1DB446') },
                { type: "separator", margin: "md" },
                { type: "text", text: finalDataPayload.feedback, size: "sm", margin: "md", wrap: true, color: "#334155" },
                { type: "separator", margin: "md" },
                { type: "text", text: finalDataPayload.contact, size: "xs", margin: "md", wrap: true, color: "#475569" }
              ]
            }
          }
        }]);
        liff.closeWindow();
      } catch (err) {
        alert("ส่งข้อความเข้าแชทไม่สำเร็จ: " + err.message);
        liff.closeWindow();
      }
    } else {
      liff.closeWindow();
    }
  }
</script>

</body>
</html>
